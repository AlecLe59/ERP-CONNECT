name: Anomalie
description: Signaler un comportement incorrect
title: "[Bug] "
labels: ["bug", "à trier"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Composant
      options: [Moteur, Service Windows, Communication RPC, Stockage, Sécurité, Interface, Installateur, Connecteur, Agent distant, Control Center]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: "Version d'ERP CONNECT"
    validations: { required: true }
  - type: input
    id: os
    attributes:
      label: "Système (ex. Windows Server 2022)"
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: "Étapes pour reproduire"
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: "Résultat attendu"
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: "Résultat obtenu"
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Extraits de journaux
      description: Vérifiez qu'aucun mot de passe, jeton ou donnée métier n'apparaît avant de coller.
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: J'ai retiré toute information confidentielle (secrets, données clients).
          required: true
