# Compilation et tests. Chaque job s'exécute toujours (pour que les vérifications obligatoires
# remontent un statut), mais ses étapes ne s'activent que lorsque le code correspondant existe.
name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build .NET
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Détecter la solution
        id: detect
        shell: pwsh
        run: |
          $has = Test-Path "ErpConnect.slnx"
          "present=$($has.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $has) { Write-Host "Aucune solution .NET pour l'instant : étapes ignorées." }
      - uses: actions/setup-dotnet@v4
        if: steps.detect.outputs.present == 'true'
        with:
          global-json-file: global.json
      - name: Restaurer
        if: steps.detect.outputs.present == 'true'
        run: dotnet restore ErpConnect.slnx --locked-mode
      - name: Compiler
        if: steps.detect.outputs.present == 'true'
        run: dotnet build ErpConnect.slnx -c Release --no-restore
      - name: Contrat TypeScript à jour
        if: steps.detect.outputs.present == 'true'
        shell: pwsh
        run: |
          dotnet run --project tools/ErpConnect.Tools.ContractGen -c Release --no-build
          git diff --exit-code -- ui/packages/contracts src/ErpConnect.Contracts/contract.snapshot.json
      - name: Tests
        if: steps.detect.outputs.present == 'true'
        # Les tests SFTP exigent un serveur OpenSSH local : ils tournent dans le job Linux.
        run: dotnet test ErpConnect.slnx -c Release --no-build --filter "Category!=Sftp&Category!=Ftp" --logger trx --results-directory TestResults
      - name: Paquets vulnérables
        if: steps.detect.outputs.present == 'true'
        shell: pwsh
        run: |
          $out = dotnet list ErpConnect.slnx package --vulnerable --include-transitive
          $out
          if ($out -match "has the following vulnerable packages") { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always() && steps.detect.outputs.present == 'true'
        with:
          name: dotnet-test-results
          path: TestResults

  dotnet-linux:
    name: Tests .NET (Linux, SFTP réel)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Serveur OpenSSH pour les tests SFTP
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Serveur FTPS pour les tests FTP (pyftpdlib, TLS obligatoire)
        run: python3 -m pip install pyftpdlib==2.2.0 pyopenssl==26.4.0
      # Vrais serveurs de base de données pour les tests des connecteurs (mot de passe généré à chaque exécution, masqué).
      - name: Serveurs PostgreSQL, SQL Server, MySQL, Oracle et pilote ODBC
        run: |
          sudo apt-get install -y unixodbc odbc-postgresql
          PW="T$(openssl rand -hex 12)a!"
          echo "::add-mask::$PW"
          docker run -d --name pg -e POSTGRES_PASSWORD="$PW" -e POSTGRES_DB=erp -p 54320:5432 postgres:16
          docker run -d --name mssql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$PW" -p 14330:1433 mcr.microsoft.com/mssql/server:2022-latest
          docker run -d --name mysql -e MYSQL_ROOT_PASSWORD="$PW" -e MYSQL_DATABASE=erp -p 33060:3306 mysql:8.4
          docker run -d --name oracle -e ORACLE_PASSWORD="$PW" -e APP_USER=erp -e APP_USER_PASSWORD="$PW" -p 15210:1521 gvenzl/oracle-free:23-slim
          wait_for() { for i in $(seq 1 120); do if eval "$2" > /dev/null 2>&1; then echo "$1 prêt"; return 0; fi; sleep 5; done; echo "$1 indisponible"; docker logs "$1" | tail -20; return 1; }
          wait_for pg "docker exec pg pg_isready -U postgres"
          wait_for mysql "docker exec mysql mysql -uroot -p\"$PW\" -e 'SELECT 1'"
          wait_for mssql "docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$PW\" -Q 'SELECT 1'"
          wait_for oracle "docker logs oracle 2>&1 | grep -q 'DATABASE IS READY TO USE'"
          {
            echo "ERPCONNECT_REQUIRE_DB=1"
            echo "ERPCONNECT_TEST_POSTGRESQL={\"host\":\"127.0.0.1\",\"port\":\"54320\",\"database\":\"erp\",\"username\":\"postgres\",\"password\":\"$PW\",\"tls\":\"disable\"}"
            echo "ERPCONNECT_TEST_SQLSERVER={\"host\":\"127.0.0.1\",\"port\":\"14330\",\"database\":\"erp\",\"username\":\"sa\",\"password\":\"$PW\",\"tls\":\"require\",\"trustServerCertificate\":\"true\"}"
            echo "ERPCONNECT_TEST_MYSQL={\"host\":\"127.0.0.1\",\"port\":\"33060\",\"database\":\"erp\",\"username\":\"root\",\"password\":\"$PW\",\"tls\":\"require\",\"trustServerCertificate\":\"true\"}"
            echo "ERPCONNECT_TEST_ORACLE={\"host\":\"127.0.0.1\",\"port\":\"15210\",\"database\":\"FREEPDB1\",\"username\":\"erp\",\"password\":\"$PW\",\"tls\":\"disable\"}"
            echo "ERPCONNECT_TEST_ODBC={\"connectionString\":\"Driver={PostgreSQL Unicode};Server=127.0.0.1;Port=54320;Database=erp;SSLMode=disable\",\"username\":\"postgres\",\"password\":\"$PW\"}"
          } >> "$GITHUB_ENV"
      - run: dotnet restore ErpConnect.slnx --locked-mode
      - run: dotnet build ErpConnect.slnx -c Release --no-restore
      # Les tests SFTP et FTPS lancent leurs propres serveurs sans privilège (port local aléatoire, clés et mot de passe générés).
      - name: Tests
        run: dotnet test ErpConnect.slnx -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-linux-test-results
          path: TestResults

  ui:
    name: Build UI
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Détecter l'interface
        id: detect
        shell: pwsh
        working-directory: .
        run: |
          $has = Test-Path "ui/desktop/package.json"
          "present=$($has.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/desktop/package-lock.json
      - if: steps.detect.outputs.present == 'true'
        run: npm ci
      - if: steps.detect.outputs.present == 'true'
        run: npm run lint
      - if: steps.detect.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.detect.outputs.present == 'true'
        run: npm test -- --run
      - if: steps.detect.outputs.present == 'true'
        run: npm audit --audit-level=high --omit=dev

  tauri:
    name: Build Tauri shell
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Détecter la coquille Tauri
        id: detect
        shell: pwsh
        run: |
          $has = Test-Path "ui/desktop/src-tauri/Cargo.toml"
          "present=$($has.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/desktop/package-lock.json
      - name: Construire l'interface (requise par generate_context!)
        if: steps.detect.outputs.present == 'true'
        working-directory: ui/desktop
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        if: steps.detect.outputs.present == 'true'
        with:
          components: clippy, rustfmt
      - name: Format
        if: steps.detect.outputs.present == 'true'
        run: cargo fmt --manifest-path ui/desktop/src-tauri/Cargo.toml --all -- --check
      - name: Clippy
        if: steps.detect.outputs.present == 'true'
        run: cargo clippy --manifest-path ui/desktop/src-tauri/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Tests
        if: steps.detect.outputs.present == 'true'
        run: cargo test --manifest-path ui/desktop/src-tauri/Cargo.toml --workspace --locked
