[package]
name = "erp-connect-relay"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
publish = false
description = "Relais JSON-RPC vers le named pipe du moteur, sans logique métier"

[dependencies]
serde_json = "1"
tokio = { version = "1.54", features = ["io-util", "sync", "time", "rt", "macros", "net"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tokio = { version = "1.54", features = ["io-util", "sync", "time", "rt-multi-thread", "macros"] }
