[workspace]
members = [".", "relay"]
resolver = "2"

[package]
name = "erp-connect-desktop"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
publish = false
description = "Coquille Tauri d'ERP Connect : relais engine_call uniquement (ADR 0003)"

[lib]
name = "erp_connect_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# Aucun plugin Tauri (fichiers, shell, HTTP…) : seule la commande engine_call est exposée.
tauri = { version = "2.12", features = [] }
serde_json = "1"
tokio = { version = "1.54", features = ["sync", "time"] }
erp-connect-relay = { path = "relay" }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
